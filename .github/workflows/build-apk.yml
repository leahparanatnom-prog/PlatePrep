name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Flutter project root
        run: |
          PUBSPEC_PATH=$(find . -maxdepth 3 -name "pubspec.yaml" -not -path "./.git/*" | head -n 1)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: pubspec.yaml not found in repository. Files at repo root:"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found Flutter project at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Populate missing Android template files (non-destructive)
        run: |
          flutter create --platforms=android --org com.example --project-name plateprep /tmp/android_tpl
          rm -f /tmp/android_tpl/android/local.properties /tmp/android_tpl/android/*.gradle.kts /tmp/android_tpl/android/app/*.gradle.kts
          mkdir -p "$PROJECT_DIR/android"
          cp -rn /tmp/android_tpl/android/. "$PROJECT_DIR/android/"
          chmod +x "$PROJECT_DIR/android/gradlew"

      - name: Install Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build Android Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlatePrep-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
