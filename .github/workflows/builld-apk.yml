name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Populate missing Android template files (non-destructive)
        run: |
          flutter create --platforms=android --org com.example --project-name plateprep /tmp/android_tpl
          rm -f /tmp/android_tpl/android/local.properties
          cp -rn /tmp/android_tpl/android/. android/
          chmod +x android/gradlew

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlatePrep-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
