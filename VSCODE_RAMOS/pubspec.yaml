name: plateprep
description: "PlatePrep - A student-friendly meal planner and kitchen assistant designed to help organize weekly meals, generate shopping lists, and manage cooking preparation."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core and Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # State Management & Utilities
  provider: ^6.1.2
  intl: ^0.19.0
  uuid: ^4.4.0

  # Design & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets can be placed in assets/
  # assets:
  #   - assets/images/

